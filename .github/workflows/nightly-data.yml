# Refresh the outside data in MongoDB Atlas every night, in the cloud (no laptop needed).
# Downloads the nightly labor databases (OSHA alone is ~7 GB unzipped) onto GitHub's runner,
# keeps only our brands' last two years, writes to Atlas, and the runner is discarded afterwards.
#
# Setup (once): repo Settings -> Secrets and variables -> Actions -> New repository secret
#   MONGODB_URI   the Atlas connection string (same as backend/.env)
# Atlas Network Access must allow GitHub's runners (it currently allows 0.0.0.0/0).

name: Nightly data refresh

on:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC, after labordata's nightly builds finish
  workflow_dispatch: {}     # "Run workflow" button for a manual refresh

concurrency:
  group: nightly-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: accountable
      USE_MOCK_DATA: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the secret is set
        run: test -n "$MONGODB_URI" || (echo "Add the MONGODB_URI repository secret" && exit 1)

      - name: Load all sources into Atlas
        run: python -m scripts.load_data all

      - name: Coverage report
        if: always()
        run: python -m scripts.data_report --all-brands
